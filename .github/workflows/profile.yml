name: Refresh research profile

on:
  schedule:
    - cron: "17 4 * * 1"   # every Monday 04:17 UTC. Every other week: "17 4 1,15 * *"
  workflow_dispatch:         # manual "Run workflow" button

permissions:
  contents: write

concurrency:
  group: profile-refresh
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests beautifulsoup4

      - name: Fetch data and render cards
        env:
          SERPAPI_KEY: ${{ secrets.SERPAPI_KEY }}
          OPENALEX_API_KEY: ${{ secrets.OPENALEX_API_KEY }}
        run: python scripts/build_profile.py

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md assets data
          git diff --staged --quiet || git commit -m "Refresh research profile"
          git push

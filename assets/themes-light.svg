<svg xmlns="http://www.w3.org/2000/svg" width="412" height="300" viewBox="0 0 412 300" role="img" aria-label="Research themes"><title>Research themes</title><style>
.sans{font-family:'Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Helvetica,Arial,sans-serif} .serif{font-family:Georgia,Gelasio,'Times New Roman',Times,serif}
@keyframes up{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes growY{from{transform:scaleY(0)}to{transform:scaleY(1)}}
@keyframes growX{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes pop{from{opacity:0;transform:scale(.3)}to{opacity:1;transform:scale(1)}}
@keyframes draw{from{stroke-dashoffset:1}to{stroke-dashoffset:0}}
@keyframes fade{from{opacity:0}to{opacity:1}}
.up{animation:up .7s cubic-bezier(.2,.7,.2,1) both}
.gy{transform-box:fill-box;transform-origin:50% 100%;animation:growY .9s cubic-bezier(.2,.7,.2,1) both}
.gx{transform-box:fill-box;transform-origin:0 50%;animation:growX .9s cubic-bezier(.2,.7,.2,1) both}
.pop{transform-box:fill-box;transform-origin:center;animation:pop .6s cubic-bezier(.3,1.4,.5,1) both}
.draw{stroke-dasharray:1;animation:draw 1.2s ease-out both}
.fade{animation:fade 1s ease-out both}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style><rect x=".5" y=".5" width="411" height="299" rx="14" fill="#ffffff" stroke="#d0d7de"/><text x="28" y="40" class="sans" font-size="16" font-weight="600" fill="#1f2328">Research themes</text><text x="384" y="40" class="sans" font-size="12" text-anchor="end" fill="#59636e">outputs per theme</text><text x="28" y="89" class="sans" font-size="12.5" fill="#1f2328">SARS-CoV-2 &amp; COVID-19</text><rect x="196" y="79" width="150" height="10" rx="5" fill="#eef1f4"/><rect x="196" y="79" width="150.0" height="10" rx="5" fill="#2a78d6" class="gx" style="animation-delay:0.20s"/><text x="356" y="89" class="sans" font-size="12.5" font-weight="600" fill="#1f2328">18</text><text x="28" y="121" class="sans" font-size="12.5" fill="#1f2328">Molecular diagnostics</text><rect x="196" y="111" width="150" height="10" rx="5" fill="#eef1f4"/><rect x="196" y="111" width="91.7" height="10" rx="5" fill="#2a78d6" class="gx" style="animation-delay:0.30s"/><text x="356" y="121" class="sans" font-size="12.5" font-weight="600" fill="#1f2328">11</text><text x="28" y="153" class="sans" font-size="12.5" fill="#1f2328">Zoonotic coronaviruses</text><rect x="196" y="143" width="150" height="10" rx="5" fill="#eef1f4"/><rect x="196" y="143" width="75.0" height="10" rx="5" fill="#2a78d6" class="gx" style="animation-delay:0.40s"/><text x="356" y="153" class="sans" font-size="12.5" font-weight="600" fill="#1f2328">9</text><text x="28" y="185" class="sans" font-size="12.5" fill="#1f2328">Genomic surveillance</text><rect x="196" y="175" width="150" height="10" rx="5" fill="#eef1f4"/><rect x="196" y="175" width="33.3" height="10" rx="5" fill="#2a78d6" class="gx" style="animation-delay:0.50s"/><text x="356" y="185" class="sans" font-size="12.5" font-weight="600" fill="#1f2328">4</text><text x="28" y="217" class="sans" font-size="12.5" fill="#1f2328">Vaccines &amp; immunity</text><rect x="196" y="207" width="150" height="10" rx="5" fill="#eef1f4"/><rect x="196" y="207" width="25.0" height="10" rx="5" fill="#2a78d6" class="gx" style="animation-delay:0.60s"/><text x="356" y="217" class="sans" font-size="12.5" font-weight="600" fill="#1f2328">3</text><text x="28" y="249" class="sans" font-size="12.5" fill="#1f2328">Dengue &amp; vectors</text><rect x="196" y="239" width="150" height="10" rx="5" fill="#eef1f4"/><rect x="196" y="239" width="16.7" height="10" rx="5" fill="#2a78d6" class="gx" style="animation-delay:0.70s"/><text x="356" y="249" class="sans" font-size="12.5" font-weight="600" fill="#1f2328">2</text><text x="28" y="282" class="sans" font-size="11" fill="#59636e">Counted from titles; one output can cover several themes</text></svg>